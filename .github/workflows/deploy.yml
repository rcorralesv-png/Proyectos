name: CD — Despliegue a GitHub Pages

on:
  # Solo se despliega cuando el código llega a main — nunca desde PRs
  push:
    branches: [master]

# Least Privilege: solo los permisos mínimos necesarios para Pages
permissions:
  contents: read        # Leer el código a desplegar
  pages: write          # Publicar en GitHub Pages
  id-token: write       # OIDC — autenticación sin secretos de larga duración

# Evitar despliegues concurrentes; el nuevo cancela al anterior en cola
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar a GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción (Vite)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
